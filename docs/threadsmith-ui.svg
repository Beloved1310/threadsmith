  <g transform="translate(0,0)">
    <circle cx="234" cy="318" r="20" fill="#3f9cff"/>
    <text x="226" y="325" fill="#EAF4FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
    <text x="268" y="318" fill="#F2F9FF" font-family="Arial, sans-serif" font-size="14" font-weight="600">You</text>
    <text x="315" y="318" fill="#9bb0c2" font-family="Arial, sans-serif" font-size="13">1/6</text>
    <rect x="264" y="332" width="620" height="1" fill="#2a3a4d"/>
    <text x="268" y="365" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20">The “Ghost Query” bug is a silent killer. Your ORM generates a query so</text>
    <text x="268" y="398" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20"> bloated it exceeds the database's packet size, crashing the app with a</text>
    <text x="268" y="431" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20"> “Query Too Large” error. You can’t fix it if you can’t read the SQL it hid</text>
    <text x="268" y="464" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20"> from you.</text>
    <rect x="268" y="488" width="70" height="30" rx="15" fill="#172738" stroke="#27364a"/>
    <text x="285" y="509" fill="#B7C5D4" font-family="Arial, sans-serif" font-size="12">Punchier</text>
    <rect x="354" y="488" width="70" height="30" rx="15" fill="#172738" stroke="#27364a"/>
    <text x="375" y="509" fill="#B7C5D4" font-family="Arial, sans-serif" font-size="12">Shorter</text>
    <rect x="440" y="488" width="70" height="30" rx="15" fill="#172738" stroke="#27364a"/>
    <text x="465" y="509" fill="#B7C5D4" font-family="Arial, sans-serif" font-size="12">Rewrite</text>
    <circle cx="817" cy="504" r="18" fill="none" stroke="#3cc7f5" stroke-width="3" stroke-dasharray="48 18"/>
    <text x="830" y="510" fill="#DDEEF9" font-family="Arial, sans-serif" font-size="13">233</text>
  </g>

  <g transform="translate(0,0)">
    <circle cx="234" cy="545" r="20" fill="#3f9cff"/>
    <text x="226" y="552" fill="#EAF4FF" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
    <text x="268" y="545" fill="#F2F9FF" font-family="Arial, sans-serif" font-size="14" font-weight="600">You</text>
    <text x="315" y="545" fill="#9bb0c2" font-family="Arial, sans-serif" font-size="13">2/6</text>
    <text x="268" y="578" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20">In 2002, Joel Spolsky coined the Law of Leaky Abstractions. Every non-</text>
    <text x="268" y="611" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20">trivial abstraction eventually “leaks” the details of the system under-</text>
    <text x="268" y="644" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20">neath. With ORMs, that leak is usually a performance cliff that requires</text>
    <text x="268" y="677" fill="#E9F0F7" font-family="Arial, sans-serif" font-size="20">raw SQL to climb.</text>
    <circle cx="813" cy="625" r="18" fill="none" stroke="#3cc7f5" stroke-width="3" stroke-dasharray="48 18"/>
    <text x="826" y="631" fill="#DDEEF9" font-family="Arial, sans-serif" font-size="13">234</text>
  </g>

  <rect x="1060" y="120" width="470" height="742" rx="18" fill="#0e171f" stroke="#202f3d"/>
  <text x="1088" y="158" fill="#E9F4FF" font-family="Arial, sans-serif" font-size="15">5/6 Debugging ORM-generated code is a nightmare.</text>
  <text x="1088" y="194" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">For complex reports, an ORM might spit out</text>
  <text x="1088" y="218" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">thousands of characters of SQL and unnecessary</text>
  <text x="1088" y="242" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">LEFT JOINs. A human-written query is often 90%</text>
  <text x="1088" y="266" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">shorter and significantly faster.</text>

  <text x="1088" y="314" fill="#E9F4FF" font-family="Arial, sans-serif" font-size="15">6/6 ORMs are convenient, but they are specific to</text>
  <text x="1088" y="338" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">your language and framework. SQL is a universal</text>
  <text x="1088" y="362" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">foundation that stays relevant as tools change.</text>
  <text x="1088" y="386" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">Master the relational model first; the abstraction</text>
  <text x="1088" y="410" fill="#9fadc1" font-family="Arial, sans-serif" font-size="15">can wait.</text>

  <text x="1088" y="460" fill="#E9F4FF" font-family="Arial, sans-serif" font-size="15">What’s the worst query your ORM ever generated?</text>

  <text x="1088" y="520" fill="#E9F4FF" font-family="Arial, sans-serif" font-size="22" font-weight="600">Would you like me to post this to X?</text>

  <rect x="1297" y="674" width="126" height="38" rx="19" fill="#1d2530"/>
  <text x="1339" y="700" fill="#F4F7FB" font-family="Arial, sans-serif" font-size="16" font-weight="600">post it</text>

